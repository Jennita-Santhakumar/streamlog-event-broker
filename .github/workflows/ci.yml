name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: esb
          POSTGRES_PASSWORD: esb
          POSTGRES_DB: esb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U esb -d esb"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://esb:esb@localhost:5432/esb?sslmode=disable
      HTTP_PORT: "8080"
      DATA_DIR: /tmp/esb-data
      BROKER_ID: "1"
      RETENTION_CHECK_INTERVAL_SECONDS: "60"
      SEGMENT_MAX_BYTES: "16777216"
      SHUTDOWN_GRACE_SECONDS: "15"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Run migrations
        run: go run ./cmd/migrate up

      - name: Unit tests
        run: go test -race -short ./...

      - name: Integration tests
        run: go test -race -tags=integration ./tests/integration/...

      - name: Build
        run: |
          go build -o bin/broker ./cmd/broker
          go build -o bin/migrate ./cmd/migrate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
